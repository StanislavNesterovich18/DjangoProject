[project]
name = "djangoproject"
version = "0.1.0"
description = ""
authors = [
    { name = "Your Name", email = "you@example.com" }
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django (>=6.0.4,<7.0.0)",
    "psycopg2 (>=2.9.11,<3.0.0)",
    "redis (>=7.4.0,<8.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "pillow (>=12.2.0,<13.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "ipython (>=9.13.0,<10.0.0)"
]
lint = [
    "isort (>=8.0.1,<9.0.0)",
    "black (>=26.3.1,<27.0.0)"
]

[tool.black]
line-length = 119
extend-exclude = '''
/(
\.eggs # Исключить несколько общих каталогов
| \.git # в корне проекта
| \.hg
| \.mypy_cache
| \.tox
| \.venv
| dist
| build
| __pycache__
)/
'''

[tool.isort]
line_length = 119